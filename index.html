<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角洲行动-暗星赠送模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .simulator {
            width: 90%;
            max-width: 1400px;
            aspect-ratio: 16/9;
            position: relative;
            overflow: hidden;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
        }
        .screen {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        .screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .click-area {
            position: absolute;
            cursor: pointer;
            z-index: 5;
        }
        /* 图1 第一个商品区域 */
        #item1-click {
            top: 15%;
            left: 10%;
            width: 25%;
            height: 80%;
        }
        /* 图2 赠送按钮 */
        #send-btn {
            bottom: 5%;
            left: 35%;
            width: 30%;
            height: 12%;
        }
        /* 图3 确认按钮 */
        #confirm-btn {
            bottom: 30%;
            left: 35%;
            width: 30%;
            height: 12%;
        }
        /* 输入框样式（精准定位在赠送按钮上方） */
        #nickname-input {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 6%;
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            border-radius: 4px;
            color: white;
            padding: 0 10px;
            font-size: 16px;
            outline: none;
            z-index: 5;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="simulator">
        <!-- 图1：商城界面 -->
        <div class="screen active" id="screen1">
            <img src="image1.jpg" alt="商城界面">
            <div class="click-area" id="item1-click" onclick="goToScreen2()"></div>
        </div>
        <!-- 图2：赠送确认界面 -->
        <div class="screen" id="screen2">
            <img src="image2.jpg" alt="赠送确认">
            <input type="text" id="nickname-input" placeholder="输入好友昵称进行搜索">
            <div class="click-area" id="send-btn" onclick="goToScreen3()"></div>
        </div>
        <!-- 图3：赠送成功界面 -->
        <div class="screen" id="screen3">
            <img src="image3.jpg" alt="赠送成功">
            <div class="click-area" id="confirm-btn" onclick="goToScreen1()"></div>
        </div>
    </div>

    <script>
        function goToScreen1() {
            document.getElementById('screen1').classList.add('active');
            document.getElementById('screen2').classList.remove('active');
            document.getElementById('screen3').classList.remove('active');
            document.getElementById('nickname-input').value = '';
        }
        function goToScreen2() {
            document.getElementById('screen1').classList.remove('active');
            document.getElementById('screen2').classList.add('active');
            document.getElementById('screen3').classList.remove('active');
        }
        function goToScreen3() {
            const nickname = document.getElementById('nickname-input').value;
            if (nickname.trim() === '') {
                alert('请输入好友昵称');
                return;
            }
            document.getElementById('screen1').classList.remove('active');
            document.getElementById('screen2').classList.remove('active');
            document.getElementById('screen3').classList.add('active');
        }
    </script>
</body>
</html>
